<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Inbox</title>
<!--
  The Inbox: the page the board draws in the tab `待办` while this package is installed. It is the signed Inbox (comchatx
  `spikes/inbox-wide`, sheet 8, signed 2026-11-18) on the board's own asks (`window.cxBoard`) and elements (`Kit`). A card is a
  Markdown file anywhere in the tab: `title` (or its first heading), cx's words, `asks: true` where it asks, `level` for how urgent it
  is, and `questions` where it asks with options. Where it stands is written into its own front matter (`done`, `doneAt`, `answer`,
  `answers`, the `level` the seller picks, and `written`, the card's own time, once the page writes the file), as the base reads any
  board's card. How the seller groups and orders the cards is kept in `inbox.json` beside them, and the cards the seller has opened in
  `inbox-opened.json`. The board opens a card on a tab of its own with this page, and hands it the card's file.
-->
<style>
  body.kit { container-type: inline-size; }
  /* The page is one width from its first draw, whatever the cards and the picks, so the presses at its head do not move; the columns
     under them keep 40rem each and start at the page's left. Nothing is drawn across a column or between columns. */
  #page { max-width: calc(120rem + 2 * var(--space-7)); margin: 0 auto; }
  .t-all { max-width: 40rem; }
  .t-c2 .t-all { max-width: calc(80rem + var(--space-7)); }
  .t-c3 .t-all { max-width: none; }
  .t-all, .t-parts, .t-part { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; margin: 0; }
  .t-part.t-none { display: none; }
  @container (min-width: 41.5rem) {
    .t-c2 .t-parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-7); align-items: start; }
    .t-c2 .t-part.t-none { display: flex; }
  }
  @container (min-width: 63rem) {
    .t-c3 .t-parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--space-7); row-gap: var(--space-6); align-items: start; }
    .t-c3 .t-part.t-none { display: flex; }
  }
  /* A column has a ground of its own, its heading at the head of it in the card title's weight, the count beside it in quiet. */
  .t-parthead { display: none; align-items: center; gap: var(--space-4); min-height: var(--space-7); }
  .t-heads .t-parts { gap: var(--space-5); }
  .t-heads .t-part { padding: var(--space-4); border-radius: var(--radius-large); background: var(--frame); }
  .t-heads .t-parthead { display: flex; padding: 0 var(--space-2); }
  .t-parthead > .bp-head { display: inline-flex; align-items: center; gap: var(--space-3); margin: 0; color: var(--ink); font-size: var(--size-body); font-weight: var(--weight-strong); line-height: var(--leading-tight); }
  .t-parthead .t-n { color: var(--quiet); font-size: var(--size-small); font-weight: var(--weight-regular); font-variant-numeric: tabular-nums; }
  .t-find { display: flex; max-width: 40rem; margin-bottom: var(--space-4); }
  .t-find > .entry-field { flex: 1 1 auto; min-width: 0; }
  /* The two presses: each prints the way in force after its own mark, and is as wide as its longest way, so neither moves. */
  .t-ctls { display: inline-flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-4); min-width: 0; }
  .t-sort { position: relative; flex: none; display: inline-flex; }
  .t-sortbtn { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-height: var(--space-7); margin-left: calc(var(--space-3) * -1); padding: 0 var(--space-3); border: none; border-radius: var(--radius-small); background: none; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); text-align: start; }
  .t-sortbtn:hover:not(:disabled), .t-sortbtn[aria-expanded="true"] { color: var(--ink); }
  .t-sortbtn > svg { flex: none; width: 1rem; height: 1rem; }
  .t-says { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .t-says > svg { flex: none; width: 1rem; height: 1rem; }
  .t-ways { display: inline-grid; }
  .t-ways > span { grid-area: 1 / 1; white-space: nowrap; }
  .t-ways > span[aria-hidden="true"] { visibility: hidden; }
  .t-menu { position: absolute; z-index: 3; left: calc(var(--space-3) * -1); top: calc(100% + var(--space-2)); display: flex; flex-direction: column; min-width: 10rem; padding: var(--space-2); border: 1px solid var(--float-edge); border-radius: var(--radius); background: var(--raised); box-shadow: var(--float-shadow); }
  .t-menu [role="group"] { display: flex; flex-direction: column; }
  .t-menu button { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-3) var(--space-4); border: none; border-radius: var(--radius-small); background: none; text-align: start; white-space: nowrap; }
  .t-menu button:hover:not(:disabled) { background: var(--float-hover); }
  .t-menu button[aria-checked="true"] { font-weight: var(--weight-strong); }
  .t-menu .t-ticked { flex: none; display: inline-flex; width: 1rem; height: 1rem; }
  .t-menu .t-ticked > svg { width: 1rem; height: 1rem; }
  /* The mark of urgency: three bars, as many in ink as the level, the rest the theme's track. It leads the line under the title, so
     titles keep one left edge and the marks read down a column. No colour is added. */
  .t-meta { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .entry.t-card > .t-meta { margin-top: var(--space-1); }
  .t-level { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--space-7); height: var(--space-7); margin: 0 calc(var(--space-2) * -1); padding: 0; border: none; border-radius: var(--radius-small); background: none; color: var(--ink); }
  span.t-level { width: auto; height: auto; margin: 0; }
  .t-bars { display: block; width: 1rem; height: 1rem; }
  .t-bars > rect { fill: var(--line); }
  .t-bars > rect.lit { fill: currentColor; }
  /* The mark's small card is the level's name alone, as the kit's label is drawn: beside its mark, on the mark's own line, where it
     covers the day and no control. */
  .t-card { position: relative; }
  .t-tip { position: absolute; z-index: 2; white-space: nowrap; padding: var(--space-1) var(--space-4); border: 1px solid var(--float-edge); border-radius: var(--radius); background: var(--raised); color: var(--ink); font-size: var(--size-small); line-height: var(--leading-small); box-shadow: var(--float-shadow); pointer-events: none; }
  .entry > .t-tip.t-tip { margin: 0; }
  .unseen { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .t-list { display: flex; flex-direction: column; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  .t-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: var(--space-7); margin-bottom: var(--space-4); }
  .t-quiet { flex: none; display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--space-7); padding: 0; border: none; background: none; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .t-quiet:hover:not(:disabled) { background: none; color: var(--ink); }
  .t-quiet[hidden] { display: none; }
  .t-head { display: flex; align-items: flex-start; gap: var(--space-4); }
  .t-head > .entry-title { flex: 1 1 auto; min-width: 0; margin: 0; font-weight: var(--weight-strong); overflow-wrap: anywhere; }
  .t-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--space-7); height: var(--space-7); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1) 0 0; padding: 0; border: none; border-radius: var(--radius-round); background: none; color: var(--quiet); }
  .t-mark:hover:not(:disabled) { color: var(--ink); }
  .t-when { color: var(--quiet); font-size: var(--size-caption); line-height: var(--leading-small); }
  .t-words > p { margin: 0; overflow-wrap: anywhere; }
  .t-words > p + p { margin-top: var(--space-3); }
  .t-words.markdown, .t-past-words.markdown { margin-bottom: 0; }
  .t-past-words > p { margin: 0; overflow-wrap: anywhere; }
  .t-past-words > p + p { margin-top: var(--space-3); }
  .entry.t-card > .t-more { margin-top: 0; }
  .t-card.t-asks > .t-head { padding-right: calc(var(--space-7) - var(--space-2) + var(--space-4)); min-height: calc(var(--space-7) - var(--space-1)); }
  .t-card.t-asks > .t-mark { position: absolute; top: calc(var(--space-4) - var(--space-1)); right: calc(var(--space-5) - var(--space-2)); margin: 0; }
  /* A card that asks with options: the kit's questionnaire, its heading the question in front, clear of the × at the corner. */
  .t-form > .kit-asked > .entry-title { min-height: calc(var(--space-7) - var(--space-1)); padding-right: calc(var(--space-7) - var(--space-2) + var(--space-4)); font-weight: var(--weight-strong); }
  .t-form > .kit-asked > .entry-title + .t-meta { margin-top: calc(var(--space-1) - var(--space-4)); }
  .t-gone { display: flex; align-items: baseline; gap: var(--space-4); margin: 0; padding: 0 var(--space-5); color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .t-gone > span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-fail { margin: 0; color: var(--bad); font-size: var(--size-small); line-height: var(--leading-small); }
  /* A card of 已处理 is one of the kit's cards, as in the open Inbox; no rule above, below or inside it. A question is told from the
     next by space and by ink over quiet; the day and what was done stand at its foot. */
  .t-rows { display: flex; flex-direction: column; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  .t-done p { margin: 0; font-size: var(--size-small); line-height: var(--leading-small); overflow-wrap: anywhere; }
  .t-open { display: block; width: calc(100% + 2 * var(--space-2)); min-height: var(--space-7); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1); padding: var(--space-1) var(--space-2); border: none; border-radius: var(--radius); background: none; text-align: start; }
  .t-open > .entry-title { display: block; font-weight: var(--weight-regular); overflow-wrap: anywhere; }
  .t-open[aria-expanded="false"] > .entry-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .t-done > .t-when { display: block; }
  .entry.t-done > .t-meta, .entry.t-done > .t-when { margin-top: var(--space-3); }
  .entry.t-done > .t-open + .t-meta, .entry.t-done > .t-open + .t-when { margin-top: var(--space-2); }
  .entry.t-done > .t-open + .t-said, .entry.t-done > .t-asked + .t-said { margin-top: var(--space-2); }
  .t-done > .t-said, .t-done > .t-yours { color: var(--quiet); }
  .t-done > .t-asked { color: var(--ink); }
  .t-week { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); width: auto; padding: var(--space-3) var(--space-2); border: none; border-radius: var(--radius); background: none; text-align: start; }
  .t-week > span:last-child { color: var(--quiet); }
  /* A card that waits is one size by its kind, whatever its words: the title in two lines at most, the words cut where the card
     ends with the clamp's own mark, as the title is cut, the acts at the end of the line under the title. A card
     that asks is taller by the chat's box. The title is set as a heading in an answer is and the words as the conversation is, so a
     card reads as cx's answer does in the chat; the spaces are the theme's, a step looser than the kit's card. */
  .entry.t-card { --t-line: calc(var(--size-body) * var(--leading-body)); --t-title: calc(var(--size-lead) * var(--leading-tight));
    --t-box: calc(2.8rem + 2 * var(--space-3) + 2px + var(--size-small) * var(--leading-small) + 2 * var(--space-2) + 2px);
    --t-rest: calc(2 * var(--space-6) + 2px + 2 * var(--t-title) + var(--space-2) + var(--space-7) + var(--space-5));
    display: flex; flex-direction: column; height: calc(var(--t-rest) + 3 * var(--t-line)); padding: var(--space-6); }
  .entry.t-card.t-asks { height: calc(var(--t-rest) + 2 * var(--t-line) + var(--space-5) + var(--t-box)); }
  .entry.t-card > * { flex: none; }
  .entry.t-card > * + *:not([hidden]) { margin-top: var(--space-5); }
  .entry.t-card > .t-meta { margin-top: var(--space-2); }
  .entry.t-card > .t-mark, .entry.t-card > .t-tip { margin: 0; } /* drawn over the card, out of its flow */
  .entry.t-card > .t-words { flex: 0 1 auto; min-height: 0; margin-bottom: auto; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .entry.t-card.t-asks > .t-words { -webkit-line-clamp: 2; line-clamp: 2; } /* whole lines: what the card has over goes under the words */
  /* The preview is the words as one run of text: each block of the Markdown in line after the one before, a heading in the strong
     weight as a run-in head, a table left to the card's tab. */
  .entry.t-card > .t-words :is(p, h1, h2, h3, h4, h5, h6, ul, ol, li, blockquote) { display: inline; margin: 0; padding: 0; border: none; color: inherit; font-size: inherit; line-height: inherit; }
  .entry.t-card > .t-words > :is(h1, h2, h3, h4, h5, h6) { font-weight: var(--weight-strong); }
  .entry.t-card > .t-words > * + *::before, .entry.t-card > .t-words li + li::before { content: " "; }
  .entry.t-card > .t-words :is(table, pre, hr, img), .entry.t-card > .t-words > :is(h1, h2, h3, h4, h5, h6):has(+ :is(table, pre, hr)) { display: none; }
  .t-words.entry-body, .t-page-words:not(.markdown-body) { font-size: var(--size-body); line-height: var(--leading-body); }
  .t-words.entry-body p { margin: var(--space-4) 0; }
  .t-words.entry-body > :first-child { margin-top: 0; }
  .t-words.entry-body > :last-child { margin-bottom: 0; }
  /* An answer that outgrows the box's resting size grows it by one line, then scrolls in it; the words give that line up and keep the
     clamp's mark. A line that says the answer was not sent stands close under the box, as a field's error does, and takes the same. */
  .entry.t-card .cx-box textarea { max-height: calc(2.8rem + var(--t-line)); }
  .entry.t-card.t-asks.t-long > .t-words, .entry.t-card.t-asks:has(> .t-fail) > .t-words { -webkit-line-clamp: 1; line-clamp: 1; }
  .entry.t-card > .t-fail:not([hidden]) { margin-top: var(--space-2); }
  /* A card that asks with options is as tall as every card that asks: its title a press as every title is, its options scrolling in
     their own frame, its foot with 提交 at the card's foot; each option keeps its line, where the cost of a choice is said. The whole
     form is on the card's tab. */
  .entry.t-card.t-form > .kit-asked { flex: 1 1 0; min-height: 0; }
  .entry.t-card.t-form > .kit-asked > .entry-title { font-size: var(--size-lead); line-height: var(--leading-tight); }
  .entry.t-card.t-form > .kit-asked > .kit-options { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .entry.t-card.t-form > .kit-asked > .kit-asked-message, .t-page.t-form > .kit-asked > .kit-asked-message { font-size: var(--size-body); line-height: var(--leading-body); }
  .entry.t-card.t-form > .kit-asked > .kit-asked-message { flex: none; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .entry.t-card.t-form > .kit-asked > .kit-asked-foot { flex: none; margin-top: auto; }
  .t-head > .entry-title { font-size: var(--size-lead); line-height: var(--leading-tight); }
  .t-card.t-asks > .t-mark { top: calc(var(--space-6) - var(--space-1)); right: calc(var(--space-6) - var(--space-2)); }
  /* The title is the press that opens the card on a tab of its own, as a file's name in the chat opens the file's: under the pointer a
     shade behind it, as behind every press of the page, and no underline. */
  .t-name { display: block; width: calc(100% + 2 * var(--space-2)); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1); padding: var(--space-1) var(--space-2); border: none; border-radius: var(--radius); background: none; color: inherit; font: inherit; text-align: start; }
  /* Under the pointer every press the page draws takes the theme's ground for that job (`--float-hover`, main's theme.css: "the ground
     under the pointer app-wide on anything a person can press"), the title as its marks; 0.4.1 draws the marks, the level and the two
     picks on --hover, which in the dark theme is another colour than the kit's own presses. A row under 已处理 is one of them. */
  .t-name:hover:not(:disabled), .t-mark:hover:not(:disabled), .t-level:hover:not(:disabled), .t-sortbtn:hover:not(:disabled), .t-sortbtn[aria-expanded="true"], .t-week:hover:not(:disabled), .t-open:hover:not(:disabled) { background: var(--float-hover); }
  .t-name > span { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  /* The card's acts stand at its corner in one row, 复制 before the card's own ✓ or ×, as a file's tab ends its row with 复制 and
     下载; the line under the title keeps the level and the time, as signed. The level mark opens the page's own menu, as the two
     presses at its head open theirs. */
  .t-head > .t-acts { flex: none; display: inline-flex; align-items: center; gap: var(--space-2); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1) 0 0; }
  .t-head > .t-acts > .t-mark { margin: 0; }
  .t-card.t-form > .t-quote { position: absolute; top: calc(var(--space-6) - var(--space-1)); right: calc(var(--space-6) - var(--space-2) + 2 * (var(--space-7) + var(--space-2))); margin: 0; }
  .t-card.t-form > .t-copy { position: absolute; top: calc(var(--space-6) - var(--space-1)); right: calc(var(--space-6) - var(--space-2) + var(--space-7) + var(--space-2)); margin: 0; }
  .t-form > .kit-asked > .entry-title { padding-right: calc(3 * var(--space-7) + 2 * var(--space-2) - var(--space-2) + var(--space-4)); }
  .t-meta { position: relative; }
  .t-levels { min-width: 9rem; }
  /* A card not yet opened carries the board's own dot, the one a tab carries while it holds something not seen, in the
     card's margin beside its title's first line, so titles keep one edge; opening the whole card takes it away. */
  .entry.t-card.t-new::before { content: ""; position: absolute; left: calc((var(--space-6) - var(--space-3)) / 2 - 1px); top: calc(var(--space-6) + var(--t-title) / 2 - var(--space-3) / 2); width: var(--space-3); height: var(--space-3); border-radius: var(--radius-round); background: var(--ink); }
  .t-levels button > .t-bars { flex: none; }
  /* A card on a tab of its own: the whole card, its words as cx's answer is drawn, its acts where the card has them. */
  .t-page { max-width: 44rem; }
  .t-page:focus { outline: none; }
  .t-page-head { display: flex; align-items: flex-start; gap: var(--space-4); }
  /* The whole card's title is the theme's for a page's title (26px), over GitHub's headings in its words (24px and less below the
     first level). */
  .t-page { --t-page-title: var(--size-display); }
  .t-page-title { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--t-page-title); font-weight: var(--weight-strong); line-height: var(--leading-tight); overflow-wrap: anywhere; }
  .t-page-head > .t-mark { margin: 0 calc(var(--space-2) * -1) 0 0; }
  .t-page.t-form > .t-mark { top: calc((var(--t-page-title) * var(--leading-tight) - var(--space-7)) / 2); right: calc(var(--space-2) * -1); }
  .t-page > .t-meta { margin-top: var(--space-3); }
  .t-page > .t-page-words { margin: var(--space-6) 0 0; }
  .t-page > .t-yours { margin: var(--space-6) 0 0; color: var(--quiet); font-size: var(--size-body); line-height: var(--leading-body); overflow-wrap: anywhere; }
  .t-page > .cx-box { margin-top: var(--space-7); }
  .t-page > .t-fail { margin-top: var(--space-2); }
  .t-page > .t-gone { margin-top: var(--space-6); padding: 0; }
  .t-page.t-form > .kit-asked > .entry-title { font-size: var(--t-page-title); }
  /* The level in colour on its lit bars only, 加急 the theme's warning yellow (`--warn`) and 特急 the theme's red; the track, the ground and every word stay as they
     were. One mark, one look, wherever it stands: the card, its menu, the whole card, 已处理. */
  .t-bars.t-l2 > rect.lit { fill: var(--warn); }
  .t-bars.t-l3 > rect.lit { fill: var(--bad); }
  /* The Inbox that has never held a card, as the board draws an empty board: the mark, the title and the line in the middle
     of the place under the page's head, in the values the board hands every page. */
  .kit-page:has(> .t-void) { min-height: calc(100vh - var(--space-5) - var(--space-7)); }
  .t-void { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); padding: 0 var(--space-6) var(--space-8); text-align: center; }
  .t-void > svg { width: var(--space-8); height: var(--space-8); margin-bottom: var(--space-2); color: var(--quiet); }
  .t-void-title { margin: 0; color: var(--ink); font-size: var(--size-lead); font-weight: var(--weight-strong); line-height: var(--leading-tight); }
  .t-void-line { margin: 0; max-width: 26rem; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .t-void-title, .t-void-line { text-wrap: balance; } /* a centred line that wraps does so in lines of one length, as main's headings do */
</style>
</head>
<body class="kit">
<div class="kit-page" id="page"></div>
<script>
(() => {
  "use strict";
  const { h, icon } = Kit;
  const board = window.cxBoard;
  const page = document.getElementById("page");
  const zh = () => Kit.lang === "zh";
  const w = (en, cn) => (zh() ? cn : en);
  const named = (verb, title) => w(`${verb} “${title}”`, `${verb}“${title}”`);
  const GLYPH = {

    : [h("span", { class: "t-level" }, bars(Number(key))), h("span", {}, W.levelWords[Number(key) - 1]()), h("span", { class: "t-n" }, String(count))]);
  /** The page's columns: `n` of them, headings and grounds where there is more than one. The page is one width whatever `n`, so the presses do not move. */
  function lay(n) {
    for (const k of [2, 3]) page.classList.toggle(`t-c${k}`, n === k);
    page.classList.toggle("t-heads", n > 1);
  }
  const headSaid = new WeakMap();
  function nowView() {
    const list = waiting();
    // A column a key; a dismissed card's line stays in its column.
    const cols = new Map(KEYS[P.by].map((key) => [key, []]));
    const put = (c, row, counts) => cols.get(keyOf(P.by, c)).push({ row, counts });
    const lines = [...S.gone.entries()].sort((a, b) => a[1].at - b[1].at);
    const gone = (file) => { const c = S.cards.get(file); if (c !== undefined) put(c, goneLine(file), false); };
    list.forEach((c, k) => { while (lines.length > 0 && lines[0][1].at <= k) gone(lines.shift()[0]); put(c, card(c), true); });
    for (const [file] of lines) gone(file);
    // By kind, a column a kind only where both wait; by urgency or time, every column, one with no card standing empty where three fit.
    const three = P.by !== "kind";
    const both = !three && cols.get("asks").length > 0 && cols.get("tells").length > 0;
    const shown = KEYS[P.by].filter((key) => three || cols.get(key).length > 0);
    // The presses and the columns stand whatever the count of cards.
    const out = [top("now", () => quiet("past", W.history(), () => { S.view = "history"; wantDone(); S.gone.clear(); S.menu = undefined; draw(); document.querySelector(".t-top > .t-quiet")?.focus(); }))];
    lay(three ? shown.length : both ? 2 : 1);
    const column = (key) => {
      const rows = cols.get(key), count = rows.filter((one) => one.counts).length;
      const part = keep(`part:${P.by}:${key}`, "", () => h("section", { class: "t-part" }, h("div", { class: "t-parthead" }, h("h2", { class: "bp-head" })), h("ul", { class: "t-list" })));
      part.classList.toggle("t-none", rows.length === 0);
      const head = part.firstChild.firstChild, said = [P.by, key, count, Kit.lang].join("|");
      if (headSaid.get(head) !== said) { headSaid.set(head, said); head.replaceChildren(...[headOf(key, count, false)].flat()); }

    };

    else {
      const all = keep("all", "", () => h("div", { class: "t-all" }));
      const parts = keep("parts", "", () => h("div", { class: "t-parts" }));

      sync(all, [parts]);
      out.push(all);
    }
    return out;
  }
  /** A card of 已处理: its title the press that opens it; a question said once, its answer under it; the day, what was done and the mark at its foot. */
  /** Whether a card's words are drawn by the board yet: none asked or come (-), refused (p), drawn (m). */
  const drawnOf = (c) => { const drawn = S.drawn.get(c.file); return drawn?.modified !== c.modified ? "-" : drawn.html === null ? "p" : "m"; };
  const pastCard = (c) => (S.shown.has(c.file) && c.form === undefined && askWords(c), keep(`past:${c.file}`, [c.modified, S.shown.has(c.file), S.shown.has(c.file) ? drawnOf(c) : "", Kit.lang].join("|"), () => pastOf(c)));
  function pastOf(c) {
    const open = S.shown.has(c.file), id = idOf(c.file);
    // An answer kept in no shape of its form is no answer of the form's: the card is drawn from its words, as one without `answers` is.
    const asForm = c.form !== undefined && !(c.done === "answered" && c.answers === undefined);
    const questions = !asForm ? [] : c.form.form === "comchatx.confirm/1" ? [{ words: c.form.title }] : c.form.questions;
    const said = (at) => (c.done !== "answered" ? W.unanswered() : c.answers?.form === "comchatx.confirm/1" ? (c.answers.confirmed ? W.asked().yes : W.asked().no) : told(c.answers?.answers?.[at]));
    const when = h("span", { class: "t-when" }, W.at(W.how[c.done](), day(c.doneAt)));
    return h("li", { id, class: "entry t-done" },
      h("button", { type: "button", class: "t-open", "aria-expanded": String(open), onclick: () => { if (open) S.shown.delete(c.file); else S.shown.add(c.file); draw(); document.getElementById(id)?.querySelector("button")?.focus(); } },
        h("span", { class: "entry-title", dir: "auto" }, c.title)),
      open && !asForm && wordsOf(c, { class: "t-past-words", dir: "auto" }),
      open && !asForm && c.done === "answered" && c.answer && h("p", { class: "t-yours", dir: "auto" }, `${W.you()}${w(": ", "：")}${c.answer}`),
      open && questions.flatMap((question, at) => [!(at === 0 && question.words === c.title) && h("p", { class: "t-asked", dir: "auto" }, question.words), h("p", { class: "t-said", dir: "auto" }, said(at))]),
      h("span", { class: "t-meta" }, h("span", { class: "t-level" }, bars(c.level)), when));

  const DAY = 24 * 60 * 60 * 1000;
  const midnight = () => { const today = new Date(); today.setHours(0, 0, 0, 0); return today.getTime(); };

  /** 已处理 in columns by the page's own two picks: the presses where they stood, 返回 where 已处理 stood, the search field under them. */
  function historyView() {
    const find = S.find.trim().toLowerCase();
    const all = done();
    const out = [top("past", () => quiet("back", W.back(), () => { S.view = "now"; S.find = ""; S.menu = undefined; draw(); document.querySelector(".t-top > .t-quiet")?.focus(); })),
      // The field is one element while 已处理 stands, so the browser keeps its words, caret and selection across a draw.
      keep("find", Kit.lang, () => { const field = h("input", { type: "search", class: "entry-field", "aria-label": W.search(), placeholder: W.search(), autocomplete: "off", value: S.find, oninput: () => { S.find = field.value; draw(); } }); return h("div", { class: "t-find" }, field); })];
    const found = find ? all.filter((c) => c.title.toLowerCase().includes(find)) : all;
    const today = midnight();
    const keys = KEYS[P.by];
    lay(keys.length);
    if (found.length === 0) { if (unread.size === 0) out.push(keep("past-empty", [Boolean(find), Kit.lang].join("|"), () => h("p", { class: "board-empty" }, find ? W.notFound() : W.noneDone()))); return out; }
    const rows = (name, cards) => { const list = keep(name, "", () => h("ul", { class: "t-rows" })); sync(list, cards.map(pastCard)); return list; };
    const column = (key) => {
      const mine = found.filter((c) => keyOf(P.by, c, c.doneAt) === key).sort((a, b) => FIRST[P.in](a, b) || b.doneAt - a.doneAt);

        const cards = older.filter((c) => weekOf(c) === k), name = `${key}:${k}`, id = `w-${key}-${k}`, open = S.weeks.has(name);
        const from = today - (14 + 7 * k) * DAY, to = today - (8 + 7 * k) * DAY;
        parts.push(keep(`week:${P.by}:${name}`, [open, cards.length, from, Kit.lang].join("|"), () => h("button", { type: "button", class: "t-week", id, "aria-expanded": String(open), onclick: () => { if (open) S.weeks.delete(name); else S.weeks.add(name); draw(); document.getElementById(id)?.focus(); } },
          h("span", {}, `${day(from)}–${day(to)}`), h("span", {}, W.items(cards.length)))));

  /** The card on a tab of its own, as the board hands the page its file: the whole card, its acts where the card has them. */

  }
  function aloneOf(c) {
    const busy = S.busy.has(c.file), id = idOf(c.file), failed = S.failed.has(c.file), open = c.done === undefined;

        h("div", { class: "t-page-head" },
          h("h1", { class: "t-page-title", id: `${id}-title`, dir: "auto" }, c.title),
          markPress("out", W.dismiss(), W.dismissIt(c.title), () => void dismiss(c), busy)),
        wordsOf(c, { class: "t-page-words", dir: "auto" }, true),
        asked.element, fail);
    }
    const box = open && c.asks && fieldOf(c.file), field = box && box.querySelector("textarea");

      h("div", { class: "t-page-head" },
        h("h1", { class: "t-page-title", id: `${id}-title`, dir: "auto" }, c.title),
        open && (c.asks ? markPress("out", W.dismiss(), W.dismissIt(c.title), () => void dismiss(c), busy) : markPress("tick", W.tick(), W.tickIt(c.title), () => void tick(c), busy))),
      open ? meta(c) : done,
      wordsOf(c, { class: "t-page-words", dir: "auto" }, true),
      !open && c.done === "answered" && c.answer && h("p", { class: "t-yours", dir: "auto" }, `${W.you()}${w(": ", "：")}${c.answer}`),
      box, fail,
      !open && c.done === "dismissed" && h("p", { class: "t-gone" }, h("button", { type: "button", class: "t-quiet", disabled: busy, onclick: () => void undo(c.file) }, h("span", {}, W.undo()))));
  }
  // The count the board holds, set once it is answered; one refused is asked again at the next drawing.
  let counted, counting;
  function draw() {
    if (!S.ready) { page.replaceChildren(status); return; }
    const typing = document.activeElement?.matches?.(".t-card input, .t-card textarea") ? document.activeElement : undefined;
    const held = typing === undefined && document.activeElement?.matches?.(".t-card, .t-open") ? document.activeElement.closest("[id]")?.id : undefined;
    const pressed = typing === undefined && held === undefined ? document.activeElement?.closest?.("[data-file]") : undefined;

    keeping = new Set();
    sync(page, [S.view === "card" ? cardView() : S.view === "history" ? historyView() : nowView(), status]);
    for (const name of [...kept.keys()]) if (!keeping.has(name)) kept.delete(name);

    for (const card of page.querySelectorAll(".entry.t-card.t-asks")) long(card);

      board.count(asks + tells, words || null).then(() => { counted = said; }, () => {}).finally(() => { if (counting === said) counting = undefined; });
    }
  }

  // The board opens a card's file on a tab of its own with this page, as it opens a file with its viewer, and hands it the file: `file`

  /** Whether a card's answer has outgrown the box's resting size, measured as it is typed and at each drawing. */

  void load();
})();
