<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Inbox</title>
<!--
  The Inbox: the page the board draws in the tab `待办` while this package is installed. It is the signed Inbox (comchatx
  `spikes/inbox-wide`, sheet 8, signed 2026-11-18) on the board's own asks (`window.cxBoard`) and elements (`Kit`). A card is a
  Markdown file anywhere in the tab: `title` (or its first heading), cx's words, `asks: true` where it asks, `level` for how urgent it
  is, and `questions` where it asks with options. Where it stands is written into its own front matter (`done`, `doneAt`, `answer`,
  `answers`), as the base reads any board's card. How the seller groups and orders the cards is kept in `inbox.json` beside them.
-->
<style>
  body.kit { container-type: inline-size; }
  /* The page is one width from its first draw, whatever the cards and the picks, so the presses at its head do not move; the columns
     under them keep 40rem each and start at the page's left. Nothing is drawn across a column or between columns. */
  #page { max-width: calc(120rem + 2 * var(--space-7)); margin: 0 auto; }
  .t-all { max-width: 40rem; }
  .t-c2 .t-all { max-width: calc(80rem + var(--space-7)); }
  .t-c3 .t-all { max-width: none; }
  .t-all, .t-parts, .t-part { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; margin: 0; }
  .t-part.t-none { display: none; }
  @container (min-width: 41.5rem) {
    .t-c2 .t-parts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--space-7); align-items: start; }
    .t-c2 .t-part.t-none { display: flex; }
    .t-c2 .t-first { width: calc(50% - var(--space-7) / 2); }
  }
  @container (min-width: 63rem) {
    .t-c3 .t-parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--space-7); row-gap: var(--space-6); align-items: start; }
    .t-c3 .t-part.t-none { display: flex; }
    .t-c3 .t-first { width: calc((100% - 2 * var(--space-7)) / 3); }
  }
  /* A column has a ground of its own, its heading at the head of it in the card title's weight, the count beside it in quiet. */
  .t-parthead { display: none; align-items: center; gap: var(--space-4); min-height: var(--space-7); }
  .t-heads .t-parts { gap: var(--space-5); }
  .t-heads .t-part { padding: var(--space-4); border-radius: var(--radius-large); background: var(--frame); }
  .t-heads .t-parthead { display: flex; padding: 0 var(--space-2); }
  .t-parthead > .bp-head { display: inline-flex; align-items: center; gap: var(--space-3); margin: 0; color: var(--ink); font-size: var(--size-body); font-weight: var(--weight-strong); line-height: var(--leading-tight); }
  .t-parthead .t-n { color: var(--quiet); font-size: var(--size-small); font-weight: var(--weight-regular); font-variant-numeric: tabular-nums; }
  .t-find { display: flex; max-width: 40rem; margin-bottom: var(--space-4); }
  .t-find > .entry-field { flex: 1 1 auto; min-width: 0; }
  /* The two presses: each prints the way in force after its own mark, and is as wide as its longest way, so neither moves. */
  .t-ctls { display: inline-flex; flex-wrap: wrap; align-items: center; column-gap: var(--space-4); min-width: 0; }
  .t-sort { position: relative; flex: none; display: inline-flex; }
  .t-sortbtn { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-height: var(--space-7); margin-left: calc(var(--space-3) * -1); padding: 0 var(--space-3); border: none; border-radius: var(--radius-small); background: none; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); text-align: start; }
  .t-sortbtn:hover:not(:disabled), .t-sortbtn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .t-sortbtn > svg { flex: none; width: 1rem; height: 1rem; }
  .t-says { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
  .t-says > svg { flex: none; width: 1rem; height: 1rem; }
  .t-ways { display: inline-grid; }
  .t-ways > span { grid-area: 1 / 1; white-space: nowrap; }
  .t-ways > span[aria-hidden="true"] { visibility: hidden; }
  .t-menu { position: absolute; z-index: 3; left: calc(var(--space-3) * -1); top: calc(100% + var(--space-2)); display: flex; flex-direction: column; min-width: 10rem; padding: var(--space-2); border: 1px solid var(--float-edge); border-radius: var(--radius); background: var(--raised); box-shadow: var(--float-shadow); }
  .t-menu [role="group"] { display: flex; flex-direction: column; }
  .t-menu button { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-3) var(--space-4); border: none; border-radius: var(--radius-small); background: none; text-align: start; white-space: nowrap; }
  .t-menu button:hover:not(:disabled) { background: var(--float-hover); }
  .t-menu button[aria-checked="true"] { font-weight: var(--weight-strong); }
  .t-menu .t-ticked { flex: none; display: inline-flex; width: 1rem; height: 1rem; }
  .t-menu .t-ticked > svg { width: 1rem; height: 1rem; }
  /* The mark of urgency: three bars, as many in ink as the level, the rest the theme's track. It leads the line under the title, so
     titles keep one left edge and the marks read down a column. No colour is added. */
  .t-meta { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
  .entry.t-card > .t-meta { margin-top: var(--space-1); }
  .t-level { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--space-7); height: var(--space-7); margin: 0 calc(var(--space-2) * -1); padding: 0; border: none; border-radius: var(--radius-small); background: none; color: var(--ink); }
  .t-level:hover:not(:disabled) { background: var(--hover); }
  span.t-level { width: auto; height: auto; margin: 0; }
  .t-bars { display: block; width: 1rem; height: 1rem; }
  .t-bars > rect { fill: var(--line); }
  .t-bars > rect.lit { fill: currentColor; }
  /* The mark's small card is the level's name alone, as the kit's label is drawn: beside its mark, on the mark's own line, where it
     covers the day and no control. */
  .t-card { position: relative; }
  .t-tip { position: absolute; z-index: 2; white-space: nowrap; padding: var(--space-1) var(--space-4); border: 1px solid var(--float-edge); border-radius: var(--radius); background: var(--raised); color: var(--ink); font-size: var(--size-small); line-height: var(--leading-small); box-shadow: var(--float-shadow); pointer-events: none; }
  .entry > .t-tip.t-tip { margin: 0; }
  .unseen { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .t-list { display: flex; flex-direction: column; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  .t-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); min-height: var(--space-7); margin-bottom: var(--space-4); }
  .t-quiet { flex: none; display: inline-flex; align-items: center; gap: var(--space-2); min-height: var(--space-7); padding: 0; border: none; background: none; color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .t-quiet:hover:not(:disabled) { background: none; color: var(--ink); }
  .t-quiet[hidden] { display: none; }
  .t-head { display: flex; align-items: flex-start; gap: var(--space-4); }
  .t-head > .entry-title { flex: 1 1 auto; min-width: 0; margin: 0; font-weight: var(--weight-strong); overflow-wrap: anywhere; }
  .t-head > .entry-title.cut { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .t-mark { flex: none; display: inline-flex; align-items: center; justify-content: center; width: var(--space-7); height: var(--space-7); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1) 0 0; padding: 0; border: none; border-radius: var(--radius-round); background: none; color: var(--quiet); }
  .t-mark:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .t-when { color: var(--quiet); font-size: var(--size-caption); line-height: var(--leading-small); }
  .t-words > p { margin: 0; overflow-wrap: anywhere; }
  .t-words > p + p { margin-top: var(--space-3); }
  .t-words.cut { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .t-words.cut > p { display: inline; }
  .t-words.cut > p + p::before { content: " "; }
  .t-words.markdown, .t-past-words.markdown { margin-bottom: 0; }
  .t-past-words > p { margin: 0; overflow-wrap: anywhere; }
  .t-past-words > p + p { margin-top: var(--space-3); }
  .entry.t-card > .t-more { margin-top: 0; }
  .t-card.t-asks > .t-head { padding-right: calc(var(--space-7) - var(--space-2) + var(--space-4)); min-height: calc(var(--space-7) - var(--space-1)); }
  .t-card.t-asks > .t-mark { position: absolute; top: calc(var(--space-4) - var(--space-1)); right: calc(var(--space-5) - var(--space-2)); margin: 0; }
  /* A card that asks with options: the kit's questionnaire, its heading the question in front, clear of the × at the corner. */
  .t-form > .kit-asked > .entry-title { min-height: calc(var(--space-7) - var(--space-1)); padding-right: calc(var(--space-7) - var(--space-2) + var(--space-4)); font-weight: var(--weight-strong); }
  .t-form > .kit-asked > .entry-title + .t-meta { margin-top: calc(var(--space-1) - var(--space-4)); }
  .t-reply { display: flex; align-items: center; gap: var(--space-4); }
  .t-reply > .entry-field { flex: 1 1 auto; min-width: 0; }
  .t-reply > button { flex: none; }
  .t-gone { display: flex; align-items: baseline; gap: var(--space-4); margin: 0; padding: 0 var(--space-5); color: var(--quiet); font-size: var(--size-small); line-height: var(--leading-small); }
  .t-gone > span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-fail { margin: 0; color: var(--bad); font-size: var(--size-small); line-height: var(--leading-small); }
  /* A card of 已处理 is one of the kit's cards, as in the open Inbox; no rule above, below or inside it. A question is told from the
     next by space and by ink over quiet; the day and what was done stand at its foot. */
  .t-rows { display: flex; flex-direction: column; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
  .t-done p { margin: 0; font-size: var(--size-small); line-height: var(--leading-small); overflow-wrap: anywhere; }
  .t-open { display: block; width: calc(100% + 2 * var(--space-2)); min-height: var(--space-7); margin: calc(var(--space-1) * -1) calc(var(--space-2) * -1); padding: var(--space-1) var(--space-2); border: none; border-radius: var(--radius); background: none; text-align: start; }
  .t-open > .entry-title { display: block; font-weight: var(--weight-regular); overflow-wrap: anywhere; }
  .t-open[aria-expanded="false"] > .entry-title { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .t-done > .t-when { display: block; }
  .entry.t-done > .t-meta, .entry.t-done > .t-when { margin-top: var(--space-3); }
  .entry.t-done > .t-open + .t-meta, .entry.t-done > .t-open + .t-when { margin-top: var(--space-2); }
  .entry.t-done > .t-open + .t-said, .entry.t-done > .t-asked + .t-said { margin-top: var(--space-2); }
  .t-done > .t-said, .t-done > .t-yours { color: var(--quiet); }
  .t-done > .t-asked { color: var(--ink); }
  .t-week { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-4); width: auto; padding: var(--space-3) var(--space-2); border: none; border-radius: var(--radius); background: none; text-align: start; }
  .t-week:hover:not(:disabled) { background: var(--hover); }
  .t-week > span:last-child { color: var(--quiet); }
</style>
</head>
<body class="kit">
<div class="kit-page" id="page"></div>
<script>
(() => {
  "use strict";
  const { h, icon } = Kit;
  const board = window.cxBoard;
  const page = document.getElementById("page");
  const zh = () => Kit.lang === "zh";
  const w = (en, cn) => (zh() ? cn : en);
  const named = (verb, title) => w(`${verb} “${title}”`, `${verb}“${title}”`);
  const GLYPH = {
    out: ["M6.5 6.5l11 11", "M17.5 6.5l-11 11"], tick: ["M5 12.5l4.5 4.5L19 7.5"], past: ["M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0-16z", "M12 8v4.5l3 1.5"],
    back: ["M14.5 6l-6 6l6 6"], sort: ["M5 7h14", "M7.5 12h9", "M10 17h4"], cols: ["M4.5 5.5h4v13h-4z", "M10 5.5h4v13h-4z", "M15.5 5.5h4v13h-4z"], down: ["M7 10l5 5l5-5"],
  };
  // The signed words: comchatx `spikes/board/README.md` rows 2 to 17 and 25 to 44 (2026-11-11); the option card's lines by their keys
  // on main; the two presses, the ways, the levels and the groups of time (copy 678 c1, 681 §4 and c3, signed 2026-11-18).
  const W = {
    history: () => w("Done", "已处理"), back: () => w("Back", "返回"), search: () => w("Search", "搜索"),
    reply: () => w("Answer cx", "回答 cx"), replyTo: (title) => named(w("Answer", "回答"), title), send: () => w("Send", "发送"),
    dismiss: () => w("Dismiss", "忽略"), dismissIt: (title) => named(w("Dismiss", "忽略"), title),
    tick: () => w("Mark as read", "已读"), tickIt: (title) => named(w("Mark as read", "标为已读"), title),
    undo: () => w("Undo", "撤销"), gone: (title) => named(w("Dismissed", "已忽略"), title),
    how: { answered: () => w("Answered", "已回答"), read: () => w("Read", "已读"), dismissed: () => w("Dismissed", "已忽略") },
    at: (how, when) => w(`${how} · ${when}`, `${when} ${how}`),
    more: () => w("Show", "展开"), less: () => w("Show less", "收起"),
    none: () => w("Nothing to do", "暂无待处理"), noneYet: () => w("What cx leaves for you will be here.", "cx 留给你的内容会放在这里。"),
    noneDone: () => w("Nothing done yet", "暂无已处理"), notFound: () => w("No title has these words.", "标题里没有这些字。"),
    items: (n) => w(`${n}`, `${n} 条`), you: () => w("You", "你"),
    unsent: () => w("Your answer was not sent.", "回答没有发出去。"),
    said: { read: () => w("Marked as read", "已标为已读"), dismissed: () => w("Dismissed", "已忽略"), answered: () => w("Sent to cx", "已交给 cx"), back: () => w("Back on the list", "已恢复") },
    count: (asks, tells) => [asks > 0 && w(`${asks} to answer`, `${asks} 条待作答`), tells > 0 && w(`${tells} to read`, `${tells} 条待查看`)].filter(Boolean).join(w(", ", "，")),
    // ask.other, ask.otherNamed, ask.submit, ask.next, ask.previous, ask.position, ask.positionSaid, dialog.skip, dialog.yes, dialog.no, dialog.unanswered
    asked: () => ({
      other: w("Another answer", "其他回答"), otherTo: (question) => named(w("Another answer to", "其他回答"), question),
      submit: w("Submit", "提交"), next: w("Next question", "下一题"), previous: w("Previous question", "上一题"),
      position: (n, total) => w(`${n} of ${total}`, `${n}/${total}`), positionSaid: (n, total) => w(`Question ${n} of ${total}:`, `第 ${n} 题，共 ${total} 题：`),
      skip: w("Skip", "跳过"), yes: w("Yes", "是"), no: w("No", "否"),
    }),
    unanswered: () => w("Not answered", "未作答"),
    split: () => w("Grouping", "分组"), inside: () => w("Ordering", "排序"),
    way: (pick, way) => (way === "kind" ? w("Type", "类型") : way === "level" ? w("Urgency", "紧急程度") : pick === "by" ? w("Date", "时间") : w("Newest", "最新")),
    levelWords: [() => w("Routine", "常规"), () => w("Urgent", "加急"), () => w("Very urgent", "特急")],
    levelSaid: [() => w("Urgency: routine", "紧急程度：常规"), () => w("Urgency: urgent", "紧急程度：加急"), () => w("Urgency: very urgent", "紧急程度：特急")],
    groups: { today: () => w("Today", "今天"), three: () => w("Last 3 days", "最近 3 天"), older: () => w("Older", "更早") },
    kinds: { asks: () => w("Questions", "提问"), tells: () => w("Updates", "汇报") },
  };
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const two = (n) => String(n).padStart(2, "0");
  const day = (at) => { const d = new Date(at); return zh() ? `${d.getMonth() + 1} 月 ${d.getDate()} 日` : `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
  const clock = (at) => { const d = new Date(at); return zh() ? `${day(at)} ${two(d.getHours())}:${two(d.getMinutes())}` : `${day(at)}, ${two(d.getHours())}:${two(d.getMinutes())}`; };

  // ---- A card, read from its file ----
  const ASKING = new Set(["proposal", "choice", "input"]);
  const DONE = new Set(["read", "answered", "dismissed"]);
  /** A front-matter value: a JSON-quoted string as written, a single-quoted one, or the bare text. */
  function value(raw) {
    const text = raw.trim();
    if (text.startsWith('"')) { try { const one = JSON.parse(text); if (typeof one === "string") return one; } catch { /* the bare text */ } }
    if (text.length > 1 && text.startsWith("'") && text.endsWith("'")) return text.slice(1, -1).replace(/''/g, "'");
    return text;
  }
  /** A file's front matter, its lines and keys, and the words after it; none where it opens with none. */
  function front(text) {
    const found = /^﻿?---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(text);
    if (found === null) return { lines: undefined, keys: new Map(), body: text.replace(/^﻿/, "") };
    const lines = found[1].split(/\r?\n/);
    const keys = new Map();
    for (const line of lines) { const one = /^([A-Za-z][\w-]*):(.*)$/s.exec(line); if (one !== null) keys.set(one[1], value(one[2])); }
    return { lines, keys, body: text.slice(found[0].length) };
  }
  const json = (text) => { try { return JSON.parse(text); } catch { return undefined; } };
  /** The questions a card asks, in the platform's form; none where its front matter holds no form whole, and the card has a field. */
  function formOf(text) {
    const form = text === undefined ? undefined : json(text);
    if (form?.form === "comchatx.confirm/1") return typeof form.title === "string" && form.title.trim() !== "" ? form : undefined;
    if (form?.form !== "comchatx.options/1" || !Array.isArray(form.questions) || form.questions.length === 0) return undefined;
    const whole = form.questions.every((one) => typeof one?.words === "string" && Array.isArray(one.options) && one.options.length > 0 && one.options.every((option) => typeof option?.name === "string"));
    return whole ? form : undefined;
  }
  /** A saved answer, taken only in the shape of the card's own form, as the platform reads one: else the card has none. */
  function answersOf(value, form) {
    if (form === undefined || value?.form !== form.form) return undefined;
    if (form.form === "comchatx.confirm/1") return typeof value.confirmed === "boolean" ? value : undefined;
    const one = (a) => a === null || (typeof a === "object" && Array.isArray(a.chosen) && a.chosen.every((name) => typeof name === "string") && (a.own === undefined || typeof a.own === "string"));
    return Array.isArray(value.answers) && value.answers.length === form.questions.length && value.answers.every(one) ? value : undefined;
  }
  function readCard(file, modified, text) {
    const { keys, body } = front(text);
    const heading = /^[ \t]*#{1,6}[ \t]+(.+?)[ \t#]*$/m.exec(body);
    const title = (keys.get("title") || (heading ? heading[1] : "") || file.split("/").pop().replace(/\.md$/i, "")).replace(/\s+/g, " ").trim();
    const rest = keys.get("title") || heading === null ? body : body.slice(0, heading.index) + body.slice(heading.index + heading[0].length);
    const words = rest.split(/\r?\n[ \t]*\r?\n/).map((one) => one.replace(/\s+/g, " ").trim()).filter((one) => one !== "");
    const done = DONE.has(keys.get("done")) ? keys.get("done") : undefined;
    const at = Date.parse(keys.get("doneAt") ?? "");
    const form = formOf(keys.get("questions"));
    const answers = json(keys.get("answers") ?? "");
    return {
      file, modified, text, title, words, body: rest, form, answers: answersOf(answers, form),
      asks: form !== undefined || keys.get("asks") === "true" || ASKING.has(keys.get("kind")), reply: keys.get("reply") === "true",
      level: ["1", "2", "3"].includes(keys.get("level")) ? Number(keys.get("level")) : 1,
      done, doneAt: Number.isFinite(at) ? at : modified, answer: keys.get("answer"),
    };
  }
  /** The file with its marks set, every other line and byte as it was; `undefined` takes them out. */
  function marked(text, mark) {
    const { lines, body } = front(text);
    const kept = (lines ?? []).filter((line) => !/^(done|doneAt|answer|answers):/.test(line));
    const added = mark === undefined ? [] : [`done: ${mark.done}`, `doneAt: ${new Date(mark.at).toISOString()}`, ...(mark.answer === undefined ? [] : [`answer: ${JSON.stringify(mark.answer)}`]), ...(mark.answers === undefined ? [] : [`answers: ${JSON.stringify(JSON.stringify(mark.answers))}`])];
    const all = [...kept, ...added];
    return all.length === 0 ? body : `---\n${all.join("\n")}\n---\n${body}`;
  }

  // ---- How the seller groups and orders the cards: two picks, kept in a small file of the tab that is no card ----
  const WAYS = ["kind", "level", "time"], IN_FOR = { kind: "level", level: "time", time: "level" };
  const KEYS = { kind: ["asks", "tells"], level: ["3", "2", "1"], time: ["today", "three", "older"] };
  const PICKS = "inbox.json";
  const P = { by: "kind", in: "level" };
  function readPicks(text) {
    const kept = json(text);
    if (!WAYS.includes(kept?.by)) return;
    P.by = kept.by;
    P.in = WAYS.includes(kept.in) && kept.in !== kept.by ? kept.in : IN_FOR[kept.by];
  }
  // Read beside the tab's first read, never before it; a tab without the file, or one it cannot read, has the default pairing.
  const picked = board.read(PICKS).then(readPicks, () => {});
  function choose(pick, to) {

  function control(pick) {
    const open = S.menu === pick, id = `sort-${pick}`, name = pick === "by" ? W.split() : W.inside();
    const now = P[pick];
    const shut = () => { S.menu = undefined; draw(); document.getElementById(id)?.focus(); };
    const item = (to) => h("button", { type: "button", role: "menuitemradio", "aria-checked": String(now === to), onclick: () => { choose(pick, to); shut(); } },
      h("span", { class: "t-ticked" }, now === to && icon(...GLYPH.tick)), h("span", {}, W.way(pick, to)));
    const show = () => { S.menu = pick; draw(); document.querySelector(`#${id}-menu [aria-checked="true"]`)?.focus(); };
    return h("div", { class: "t-sort" },
      h("button", { type: "button", class: "t-sortbtn", id, title: name, "aria-label": `${name}${w(": ", "：")}${W.way(pick, now)}`, "aria-haspopup": "menu", "aria-expanded": String(open),
        onclick: () => { if (open) shut(); else show(); }, onkeydown: (event) => { if (event.key === "ArrowDown" && !open) { event.preventDefault(); show(); } } },
        h("span", { class: "t-says" }, icon(...GLYPH[pick === "by" ? "cols" : "sort"]),
          h("span", { class: "t-ways" }, WAYS.map((way) => h("span", { "aria-hidden": way === now ? undefined : "true" }, W.way(pick, way))))),
        icon(...GLYPH.down)),
      open && h("div", { class: "t-menu", role: "menu", id: `${id}-menu`, "aria-label": name,
        onkeydown: (event) => {

  }
  const controls = () => h("span", { class: "t-ctls" }, control("by"), control("in"));
  /** A column's heading: its name and how many cards it holds. In 已处理 a kind has a name of its own, since the tab's counts say "to answer". */
  const headOf = (key, count, past) => (P.by === "kind" && !past ? [W.count(key === "asks" ? count : 0, key === "tells" ? count : 0)]

    : P.by === "time" ? [h("span", {}, W.groups[key]()), h("span", { class: "t-n" }, String(count))]
    : [h("span", { class: "t-level" }, bars(Number(key))), h("span", {}, W.levelWords[Number(key) - 1]()), h("span", { class: "t-n" }, String(count))]);
  /** The page's columns: `n` of them, headings and grounds where there is more than one. The page is one width whatever `n`, so the presses do not move. */
  function lay(n) {
    for (const k of [2, 3]) page.classList.toggle(`t-c${k}`, n === k);
    page.classList.toggle("t-heads", n > 1);
  }
  const headSaid = new WeakMap();
  function nowView() {
    const list = waiting();
    // The first card alone where it answers the seller's last message, then a column a key; a dismissed card's line stays in its column.
    const first = list[0]?.reply ? list[0] : undefined;
    const rest = list.filter((c) => c !== first);
    const cols = new Map(KEYS[P.by].map((key) => [key, []]));
    const put = (c, row, counts) => cols.get(keyOf(P.by, c)).push({ row, counts });
    const lines = [...S.gone.entries()].sort((a, b) => a[1].at - b[1].at);
    const gone = (file) => { const c = S.cards.get(file); if (c !== undefined) put(c, goneLine(file), false); };
    list.forEach((c, k) => { while (lines.length > 0 && lines[0][1].at <= k) gone(lines.shift()[0]); if (c !== first) put(c, card(c), true); });
    for (const [file] of lines) gone(file);
    // By kind, a column a kind only where both wait; by urgency or time, every column, one with no card standing empty where three fit.
    const three = P.by !== "kind";
    const both = !three && cols.get("asks").length > 0 && cols.get("tells").length > 0;
    const shown = KEYS[P.by].filter((key) => three || cols.get(key).length > 0);
    // The presses and the columns stand whatever the count of cards.
    const out = [top("now", () => quiet("past", W.history(), () => { S.view = "history"; wantDone(); S.gone.clear(); S.menu = undefined; draw(); document.querySelector(".t-top > .t-quiet")?.focus(); }))];
    lay(three ? shown.length : both ? 2 : 1);
    const column = (key) => {
      const rows = cols.get(key), count = rows.filter((one) => one.counts).length;
      const part = keep(`part:${P.by}:${key}`, "", () => h("section", { class: "t-part" }, h("div", { class: "t-parthead" }, h("h2", { class: "bp-head" })), h("ul", { class: "t-list" })));

  }
  /** A card of 已处理: its title the press that opens it; a question said once, its answer under it; the day, what was done and the mark at its foot. */
  /** Whether a card's words are drawn by the board yet: none asked or come (-), refused (p), drawn (m). */

  function pastOf(c) {

    const questions = !asForm ? [] : c.form.form === "comchatx.confirm/1" ? [{ words: c.form.title }] : c.form.questions;
    const said = (at) => (c.done !== "answered" ? W.unanswered() : c.answers?.form === "comchatx.confirm/1" ? (c.answers.confirmed ? W.asked().yes : W.asked().no) : told(c.answers?.answers?.[at]));
    const when = h("span", { class: "t-when" }, W.at(W.how[c.done](), day(c.doneAt)));
    return h("li", { id, class: "entry t-done" },
      h("button", { type: "button", class: "t-open", "aria-expanded": String(open), onclick: () => { if (open) S.shown.delete(c.file); else S.shown.add(c.file); draw(); document.getElementById(id)?.querySelector("button")?.focus(); } },
        h("span", { class: "entry-title", dir: "auto" }, c.title)),
      open && !asForm && wordsOf(c, { class: "t-past-words", dir: "auto" }),
      open && !asForm && c.done === "answered" && c.answer && h("p", { class: "t-yours", dir: "auto" }, `${W.you()}${w(": ", "：")}${c.answer}`),
      open && questions.flatMap((question, at) => [!(at === 0 && question.words === c.title) && h("p", { class: "t-asked", dir: "auto" }, question.words), h("p", { class: "t-said", dir: "auto" }, said(at))]),
      h("span", { class: "t-meta" }, h("span", { class: "t-level" }, bars(c.level)), when));
  }
  const DAY = 24 * 60 * 60 * 1000;
  const midnight = () => { const today = new Date(); today.setHours(0, 0, 0, 0); return today.getTime(); };

  const agoOf = (c) => Math.floor((midnight() - new Date(c.doneAt).setHours(0, 0, 0, 0)) / DAY);
  const weekOf = (c) => Math.floor((agoOf(c) - 8) / 7);
  /** 已处理 in columns by the page's own two picks: the presses where they stood, 返回 where 已处理 stood, the search field under them. */
  function historyView() {
    const find = S.find.trim().toLowerCase();
    const all = done();
    const out = [top("past", () => quiet("back", W.back(), () => { S.view = "now"; S.find = ""; S.menu = undefined; draw(); document.querySelector(".t-top > .t-quiet")?.focus(); })),
      // The field is one element while 已处理 stands, so the browser keeps its words, caret and selection across a draw.
      keep("find", Kit.lang, () => { const field = h("input", { type: "search", class: "entry-field", "aria-label": W.search(), placeholder: W.search(), autocomplete: "off", value: S.find, oninput: () => { S.find = field.value; draw(); } }); return h("div", { class: "t-find" }, field); })];

    const keys = KEYS[P.by];

    const column = (key) => {
      const mine = found.filter((c) => keyOf(P.by, c, c.doneAt) === key).sort((a, b) => FIRST[P.in](a, b) || b.doneAt - a.doneAt);

      for (const k of [...new Set(older.map(weekOf))]) {
        const cards = older.filter((c) => weekOf(c) === k), name = `${key}:${k}`, id = `w-${key}-${k}`, open = S.weeks.has(name);
